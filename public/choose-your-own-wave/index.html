<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Your Own Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="left">
    <div id="stage">
      <canvas id="scene" aria-label="First-person view of the plasma forest"></canvas>
      <canvas id="portalHD" aria-hidden="true"></canvas>
      <canvas id="minimap" title="Map — click to open (M)"></canvas>
      <div id="toast" hidden></div>
    </div>
    <div id="controls">
      <div class="seg" role="group" aria-label="Portal view">
        <button id="modePacket" class="pbtn on">PACKET</button>
        <button id="modePlane" class="pbtn">PLANE WAVE</button>
      </div>
      <div id="branchSel" class="seg"></div>
      <label id="kwrap">k₀ <input id="kslider" type="range" min="0" max="1000" value="400"></label>
      <div id="hud">
        <span id="progress" class="chip"></span>
        <button id="btnMap" class="pbtn" title="Map (M)">MAP</button>
        <button id="btnSound" class="pbtn" title="Sound">♪</button>
        <button id="btnHelp" class="pbtn" title="Title screen">?</button>
      </div>
    </div>
    <div id="choices"></div>
  </div>
  <aside id="journal"></aside>
</div>

<div id="overlay" hidden>
  <div id="ovbox"></div>
</div>
<div id="mapOverlay" hidden>
  <div id="mapbox">
    <div class="maphead"><span>MAP OF THE PLASMA FOREST</span><button id="mapClose" class="pbtn">CLOSE ✕</button></div>
    <canvas id="bigmap"></canvas>
    <div id="mapnote"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="js/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
